server {
    listen 80;
    server_name $ {
        NGINX_SERVER_NAM
    }
    ;
    root /var/www/wiki;
    index index.php;

    # Block Tor users from Special: pages
    location ~* ^/Special: {
        if ($http_x_usingtor = "1") {
            return 403;
        }
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location / {
        rewrite ^/$ /mediawiki/index.php last;
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location ~ \.php$ {
        # Block Tor users hitting index.php?title=Special:...
        set $block_check "";
        if ($http_x_usingtor = "1") {
            set $block_check "${block_check}T";
        }
        if ($arg_title ~* "^Special:") {
            set $block_check "${block_check}S";
        }
        if ($block_check = "TS") {
            return 403;
        }

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass mediawiki:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location = /index.php {
        rewrite ^/index.php(.*)$ /mediawiki/index.php$1 last;
    }

    # Block Tor users from the API
    location = /api.php {
        if ($http_x_usingtor = "1") {
            return 403;
        }
        rewrite ^/api.php(.*)$ /mediawiki/api.php$1 last;
    }

    location = /rest.php {
        if ($http_x_usingtor = "1") {
            return 403;
        }
        try_files $uri $uri/ /mediawiki/rest.php?$args;
    }

    location = /load.php {
        rewrite ^/load.php(.*)$ /mediawiki/load.php$1 last;
    }

    location ~ ^/Extensions/(.*)$ {
        rewrite ^/Extensions/(.*)$ /mediawiki/extensions/$1 last;
    }

    location ~ ^/skins/(.*)$ {
        rewrite ^/skins/(.*)$ /mediawiki/skins/$1 last;
    }

    location = /robots.txt {
        allow all;
    }

    location = /security.txt {
        allow all;
    }

    location = /.well-known/security.txt {
        allow all;
    }

    location = /security-at-fosswiki_public.asc {
        allow all;
    }

    location /images/ {
        deny all;
    }

    location /cache/ {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ ^/mediawiki/(maintenance|mw-config|vendor|includes|cache|tests)/ {
        deny all;
    }

    location ~ ^/mediawiki/skins/.*/dev-scripts/ {
        deny all;
    }

    access_log /var/log/nginx/mediawiki_access.log;
    error_log /var/log/nginx/mediawiki_error.log;
