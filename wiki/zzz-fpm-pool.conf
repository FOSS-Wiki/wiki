; Sourced from https://github.com/StarCitizenTools/sct-docker-images/blob/main/mediawiki/config/zzz-fpm-pool.conf
[www]
access.log = /dev/null

pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 70s
request_terminate_timeout_track_finished = yes

ping.path = /ping
ping.response = pong
