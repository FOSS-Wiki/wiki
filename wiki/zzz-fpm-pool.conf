; Sourced from https://github.com/StarCitizenTools/sct-docker-images/blob/main/mediawiki/config/zzz-fpm-pool.conf
[www]
access.log = /dev/null

pm.max_children = 30
pm.max_requests = 200
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 30

request_terminate_timeout = 300s
request_terminate_timeout_track_finished = yes
