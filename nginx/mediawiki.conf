server_tokens off;
log_format realip '$remote_addr via $realip_remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    root /var/www/wiki/mediawiki;
    index index.php;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header Onion-Location http://wiki3wvl74osnnuzsb3hdkn4b64jkjwjursi3bowr2xdeinhfmvlzyad.onion$request_uri always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; script-src-attr 'none'; object-src 'none'; base-uri 'self'" always;

    set_real_ip_from 172.20.0.5;
    real_ip_header CF-Connecting-IP;

    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    error_page 403 /403.html;
    error_page 404 /404.html;

    location / {
        rewrite ^/$ /index.php last;
        try_files $uri /index.php?$args;
    }

    location ~ ^/(?:cache|docs|images|includes|languages|maintenance|mw-config|serialized|sql|tests|vendor)(?:/|$) {
        deny all;
    }

    location ~ ^/skins/[^/]+/dev-scripts/ {
        deny all;
    }

    location ~ ^/extensions/[^/]+/tests/  {
        deny all;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~ ^/(?:COPYING|CREDITS|FAQ|HISTORY|INSTALL|RELEASE-NOTES.*|SECURITY|UPGRADE|composer\.(?:json|lock)|composer\.local\.json-sample|jsdoc\.json|bundlesize\.config\.json)$ {
        deny all;
    }

    location ~ ^/(?:index|load|api|rest|thumb|thumb_handler|img_auth|opensearch_desc)\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        set $php_upstream mediawiki:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_read_timeout 80s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location = /sitemap.xml {
        alias /var/www/wiki/sitemap/sitemap-index-foss.wiki.xml;
    }

    location ^~ /sitemap/   {
        alias /var/www/wiki/sitemap/;
    }

    location = /403.html {
        root /var/www/errors;
        internal;
    }

    location = /404.html {
        root /var/www/errors;
        internal;
    }

    access_log /dev/stdout realip buffer=32k flush=5s;
    error_log  /dev/stderr warn;
}
