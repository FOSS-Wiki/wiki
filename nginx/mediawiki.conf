server_tokens off;

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    root /var/www/wiki;
    index index.php;
	resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    client_max_body_size 64M;

    add_header Onion-Location http://wiki3wvl74osnnuzsb3hdkn4b64jkjwjursi3bowr2xdeinhfmvlzyad.onion$request_uri always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP?

    set_real_ip_from 172.20.0.0/16;
    real_ip_header CF-Connecting-IP;

    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    error_page 403 /403.html;
    error_page 404 /404.html;

    location / {
        rewrite ^/$ /mediawiki/index.php last;
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location ^~ /vendor/                { deny all; }
    location ^~ /configs/               { deny all; }
    location ^~ /overrides/             { deny all; }
    location ^~ /cache/                 { deny all; }

    location ^~ /mediawiki/maintenance/ { deny all; }
    location ^~ /mediawiki/mw-config/   { deny all; }
    location ^~ /mediawiki/vendor/      { deny all; }
    location ^~ /mediawiki/includes/    { deny all; }
    location ^~ /mediawiki/cache/       { deny all; }
    location ^~ /mediawiki/tests/       { deny all; }
    location ^~ /mediawiki/docs/        { deny all; }
    location ^~ /mediawiki/languages/   { deny all; }
    location ^~ /mediawiki/serialized/  { deny all; }
    location ^~ /mediawiki/sql/         { deny all; }
    location ^~ /mediawiki/images/      { deny all; }

    location ~ ^/mediawiki/skins/[^/]+/dev-scripts/ { deny all; }
    location ~ ^/mediawiki/extensions/[^/]+/tests/  { deny all; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~ ^/composer\.(?:json|lock)$ { deny all; }
    location ~ ^/mediawiki/(?:COPYING|CREDITS|FAQ|HISTORY|INSTALL|RELEASE-NOTES.*|SECURITY|UPGRADE|composer\.(?:json|lock)|composer\.local\.json-sample|jsdoc\.json|bundlesize\.config\.json|autoload\.php|LocalSettings\.php)$ { deny all; }

    location = /index.php {
        rewrite ^/index.php(.*)$ /mediawiki/index.php$1 last;
    }

    location = /api.php {
        rewrite ^/api.php(.*)$ /mediawiki/api.php$1 last;
    }

    location ^~ /rest.php {
        rewrite ^/rest\.php(.*)$ /mediawiki/rest.php$1 last;
    }

    location = /load.php {
        rewrite ^/load.php(.*)$ /mediawiki/load.php$1 last;
    }

    location ~ ^/Extensions/(.*)$ {
        rewrite ^/Extensions/(.*)$ /mediawiki/extensions/$1 last;
    }

    location ~ ^/skins/(.*)$ {
        rewrite ^/skins/(.*)$ /mediawiki/skins/$1 last;
    }

    location ~ ^/mediawiki/(?:index|load|api|rest|thumb|thumb_handler|img_auth|opensearch_desc)\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        set $php_upstream mediawiki:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_read_timeout 80s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location = /robots.txt {
        allow all;
    }

    location = /security.txt {
        allow all;
    }

    location = /.well-known/security.txt {
        allow all;
    }

    location = /security-at-fosswiki_public.asc {
        allow all;
    }

    location = /403.html {
        root /var/www/errors;
        internal;
    }

    location = /404.html {
        root /var/www/errors;
        internal;
    }

    access_log /dev/stdout combined buffer=32k flush=5s;
    error_log  /dev/stderr warn;
}
