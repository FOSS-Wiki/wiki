server_tokens off;

map $http_x_usingtor $tor_blocked {
    default 0;
    "1"     1;
}

map $arg_title $is_special_title {
    default       0;
    "~*^Special:" 1;
}

map "$tor_blocked:$is_special_title" $block_tor_special_php {
    default 0;
    "1:1"   1;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    root /var/www/wiki;
    index index.php;
    add_header Onion-Location http://wiki3wvl74osnnuzsb3hdkn4b64jkjwjursi3bowr2xdeinhfmvlzyad.onion$request_uri;

    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Block Tor users from Special: pages exc. Special:Search
    location ~ ^/Special:Search {
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location ~ ^/Special: {
        if ($tor_blocked) {
            return 403;
        }
        error_page 403 /tor.html;
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location / {
        rewrite ^/$ /mediawiki/index.php last;
        try_files $uri $uri/ /mediawiki/index.php?$args;
    }

    location ~ ^/.*\.php$ {
        # Block Tor users hitting index.php?title=Special:... exc. Special:Search
        if ($block_tor_special_php) {
            set $tor_php_block 1;
        }
        if ($arg_title ~* "^Special:Search") {
            set $tor_php_block 0;
        }
        if ($tor_php_block) {
            return 403;
        }
        error_page 403 /tor.html;

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass mediawiki:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location = /index.php {
        rewrite ^/index.php(.*)$ /mediawiki/index.php$1 last;
    }

    # Block Tor users from the API
    location = /api.php {
        if ($tor_blocked) {
            return 403;
        }
        error_page 403 /tor.html;
        rewrite ^/api.php(.*)$ /mediawiki/api.php$1 last;
    }

    location = /rest.php {
        if ($tor_blocked) {
            return 403;
        }
        error_page 403 /tor.html;
        try_files $uri $uri/ /mediawiki/rest.php?$args;
    }

    location = /load.php {
        rewrite ^/load.php(.*)$ /mediawiki/load.php$1 last;
    }

    location ~ ^/Extensions/(.*)$ {
        rewrite ^/Extensions/(.*)$ /mediawiki/extensions/$1 last;
    }

    location ~ ^/skins/(.*)$ {
        rewrite ^/skins/(.*)$ /mediawiki/skins/$1 last;
    }

    location = /robots.txt {
        allow all;
    }

    location = /security.txt {
        allow all;
    }

    location = /.well-known/security.txt {
        allow all;
    }

    location = /security-at-fosswiki_public.asc {
        allow all;
    }

    location /images/ {
        deny all;
    }

    location /cache/ {
        deny all;
    }

    location ~ ^/.*\.env {
        deny all;
    }

    location ~ ^/.*\.git {
        deny all;
    }

    location ~ ^/.*\.ht {
        deny all;
    }

    location ~ ^/mediawiki/(maintenance|mw-config|vendor|includes|cache|tests)/ {
        deny all;
    }

    location ~ ^/mediawiki/skins/.*/dev-scripts/ {
        deny all;
    }

    location = /tor.html {
        root /var/www/errors;
        internal;
    }

    access_log /var/log/nginx/mediawiki_access.log;
}
