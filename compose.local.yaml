name: local-wiki

services:
  mediawiki:
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    ports:
      - "3000:80"

  mariadb:
    image: mariadb:10.11
    container_name: ${STACK_NAME}-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_NAME}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./database:/var/lib/mysql
    networks:
      - wiki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    expose:
      - "3306"

  silo:
    image: pgsty/silo:latest
    container_name: ${STACK_NAME}-silo
    environment:
      MINIO_ROOT_USER: ${SILO_USER}
      MINIO_ROOT_PASSWORD: ${SILO_PASSWORD}
    volumes:
      - ./images:/data
    networks:
      - wiki-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
