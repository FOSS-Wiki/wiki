services:
  mediawiki:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEDIAWIKI_MAJOR_VERSION: ${MEDIAWIKI_MAJOR_VERSION}
        MEDIAWIKI_VERSION: ${MEDIAWIKI_VERSION}
        MEDIAWIKI_BRANCH: ${MEDIAWIKI_BRANCH}
        CITIZEN_VERSION: ${CITIZEN_VERSION}
    image: ${STACK_NAME}-mediawiki
    container_name: ${STACK_NAME}-mediawiki
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - .env:/var/www/wiki/.env:ro
      - ./overrides:/var/www/wiki/overrides:ro
      - wiki-sitemap:/var/www/wiki/sitemap
      - wiki-cache:/var/www/wiki/cache
    networks:
      - wiki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    expose:
      - "9000"

  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder AS builder
        RUN xcaddy build \
          --with github.com/caddy-dns/cloudflare \
          --with github.com/WeidiDeng/caddy-cloudflare-ip

        FROM caddy:2
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
        COPY --from=mediawiki /var/www/wiki /var/www/wiki
      additional_contexts:
        mediawiki: service:mediawiki
    image: ${STACK_NAME}-caddy
    container_name: ${STACK_NAME}-caddy
    depends_on:
      mediawiki:
        condition: service_healthy
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN}
      CLOUDFLARE_DNS_TOKEN: ${CLOUDFLARE_DNS_TOKEN}
    volumes:
      - ./caddy/wiki.snippet:/etc/caddy/wiki.snippet:ro
      - ./caddy/error.html:/srv/error.html:ro
      - wiki-sitemap:/var/www/wiki/sitemap:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - wiki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  valkey:
    image: valkey/valkey:alpine
    container_name: ${STACK_NAME}-valkey
    volumes:
      - ./valkey:/data:Z
    networks:
      - wiki-network
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    expose:
      - "6379"

  opensearch:
    image: docker-registry.wikimedia.org/repos/search-platform/cirrussearch-opensearch-image:v3.8.0-5
    container_name: ${STACK_NAME}-opensearch
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: -500
    environment:
      - discovery.type=single-node
      - cluster.name=mediawiki-cluster
      - node.name=mediawiki-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch:/usr/share/opensearch/data:Z
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 10s
      retries: 3
    expose:
      - "9200"

networks:
  wiki-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  wiki-sitemap:
  wiki-cache:
