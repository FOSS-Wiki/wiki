services:
  mediawiki:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEDIAWIKI_MAJOR_VERSION: ${MEDIAWIKI_MAJOR_VERSION}
        MEDIAWIKI_VERSION: ${MEDIAWIKI_VERSION}
        MEDIAWIKI_BRANCH: ${MEDIAWIKI_BRANCH}
        CITIZEN_VERSION: ${CITIZEN_VERSION}
    container_name: ${STACK_NAME}-mediawiki
    depends_on:
      valkey:
        condition: service_started
    volumes:
      - wiki-webroot:/var/www/wiki
      - .env:/var/www/wiki/.env:ro
    networks:
      - wiki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    expose:
      - "9000"

  nginx:
    image: nginx:stable-alpine
    container_name: ${STACK_NAME}-nginx
    depends_on:
      mediawiki:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${SITENAME}
    volumes:
      - wiki-webroot:/var/www/wiki:ro
      - ./nginx/mediawiki.conf:/etc/nginx/templates/mediawiki.conf.template:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tor.html:/var/www/errors/tor.html:ro
      - ./nginx/403.html:/var/www/errors/403.html:ro
      - ./nginx/404.html:/var/www/errors/404.html:ro
      - /var/log/nginx/wiki:/var/log/nginx
    networks:
      - wiki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    expose:
      - "80"

  valkey:
    image: valkey/valkey:alpine
    container_name: ${STACK_NAME}-valkey
    volumes:
      - valkey-data:/data
    networks:
      - wiki-network
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    expose:
      - "6379"

  opensearch:
    image: ${OPENSEARCH_IMAGE}
    container_name: ${STACK_NAME}-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=mediwiki-cluster
      - node.name=mediwiki-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - "./opensearch:/usr/share/opensearch/data${OPENSEARCH_VOL_FLAG:-}"
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "9200"

networks:
  wiki-network:
    driver: bridge

volumes:
  wiki-webroot:
    driver: local
  valkey-data:
    driver: local
